<style>
  :root { --ease: cubic-bezier(.32, .72, .24, 1); }

  /* Splash AnimeKuu: total sekitar 6 detik. Masuk halus, keluar halus. */
  .ak-splash {
    position: fixed; inset: 0; z-index: 99999;
    background: #000;
    display: flex; align-items: center; justify-content: center;
    animation: ak-fadein .6s ease;
    transition: opacity .8s ease, filter .8s ease, transform .8s ease, visibility .8s;
    will-change: opacity, filter, transform;
  }
  @keyframes ak-fadein { 0% { opacity: 0; } 100% { opacity: 1; } }
  .ak-splash.ak-out { opacity: 0; visibility: hidden; transform: scale(1.04); }
  .ak-splash-inner { display: flex; flex-direction: column; align-items: center; gap: 20px; }

  .ak-logo { width: 180px; height: auto; overflow: visible; }

  /* kilauan: satu cahaya melintas di atas logo */
  .ak-sweep { animation: ak-sweep 1.3s cubic-bezier(.45, 0, .25, 1) 3s both; }
  @keyframes ak-sweep { 0% { transform: translateX(0); } 100% { transform: translateX(1000px); } }

  /* percikan kecil yang berkedip */
  .ak-spark { transform-box: fill-box; transform-origin: 50% 50%; opacity: 0; }
  .ak-s1 { animation: ak-spark 1s ease-in-out 3.1s both; }
  .ak-s2 { animation: ak-spark 1s ease-in-out 3.6s both; }
  @keyframes ak-spark {
    0%   { opacity: 0; transform: scale(0) rotate(0deg); }
    50%  { opacity: 1; transform: scale(1) rotate(45deg); }
    100% { opacity: 0; transform: scale(.2) rotate(90deg); }
  }
  .ak-part { transform-box: fill-box; transform-origin: 50% 50%; opacity: 0; will-change: transform, opacity; }
  .ak-p1 { animation: ak-from-top 1.6s var(--ease) .3s both; }
  .ak-p2 { animation: ak-from-left 1.7s var(--ease) .9s both; }
  .ak-p3 { animation: ak-from-right 1.7s var(--ease) 1s both; }
  @keyframes ak-from-top   { 0% { opacity: 0; transform: translateY(-120px); } 100% { opacity: 1; transform: none; } }
  @keyframes ak-from-left  { 0% { opacity: 0; transform: translate(-110px, -30px); } 100% { opacity: 1; transform: none; } }
  @keyframes ak-from-right { 0% { opacity: 0; transform: translate(110px, -30px); } 100% { opacity: 1; transform: none; } }

  /* judul: warna per huruf, muncul satu per satu */
  .ak-title {
    font-family: "Plus Jakarta Sans", system-ui, sans-serif;
    font-weight: 800; font-size: 32px; letter-spacing: .5px;
    animation: ak-letter-sp 1.6s var(--ease) 1.8s both;
  }
  .ak-title span {
    display: inline-block; opacity: 0; transform: translateY(12px);
    animation: ak-letter-in 1s var(--ease) forwards, ak-letter-out .7s ease forwards;
    animation-delay: calc(1.9s + var(--i) * .05s), calc(3.6s + (7 - var(--i)) * .04s);
  }
  @keyframes ak-letter-in { to { opacity: 1; transform: none; } }
  @keyframes ak-letter-out { to { opacity: 0; transform: translateY(-10px); } }
  @keyframes ak-letter-sp { 0% { letter-spacing: 14px; } 100% { letter-spacing: .5px; } }

  @media (prefers-reduced-motion: reduce) {
    .ak-splash, .ak-part, .ak-title span, .ak-logo { animation: none !important; opacity: 1; transform: none; filter: none; }
  }
</style>

<script>
  // Splash AnimeKuu: tampil sampai animasi selesai (sekitar 5,2 detik), lalu keluar halus.
  (function () {
    var splash = document.getElementById("animekuu-splash");
    if (!splash) return;
    var title = document.getElementById("akTitle");
    if (title) {
      var text = title.textContent, n = text.length;
      var c1 = [25, 253, 215], c2 = [26, 129, 250];
      var hex = function (c) { return "#" + c.map(function (v) { return ("0" + Math.round(v).toString(16)).slice(-2); }).join(""); };
      title.innerHTML = Array.prototype.map.call(text, function (ch, i) {
        var k = n > 1 ? i / (n - 1) : 0;
        var col = c1.map(function (v, j) { return v + (c2[j] - v) * k; });
        return '<span style="--i:' + i + ';color:' + hex(col) + '">' + ch + '</span>';
      }).join("");
    }
    var startedAt = Date.now();
    var done = false;
    function hideSplash() {
      if (done) return;
      done = true;
      var wait = Math.max(0, 3800 - (Date.now() - startedAt));
      setTimeout(function () {
        splash.classList.add("ak-out");
        setTimeout(function () { splash.remove(); }, 850);
      }, wait);
    }
    if (document.readyState === "complete") hideSplash();
    else window.addEventListener("load", hideSplash);
    setTimeout(hideSplash, 6000); // jaga-jaga kalau load tertahan
  })();
</script>
