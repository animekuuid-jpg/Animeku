<style>
  .ak-splash {
    position: fixed; inset: 0; z-index: 99999;
    background: #000;
    display: flex; align-items: center; justify-content: center;
    transition: opacity .6s ease, visibility .6s ease;
  }
  .ak-splash.ak-out { opacity: 0; visibility: hidden; }
  .ak-splash-inner {
    display: flex; flex-direction: column; align-items: center; gap: 18px;
  }
  .ak-logo { width: 170px; height: auto; overflow: visible; }
  .ak-part {
    transform-box: fill-box; transform-origin: center;
    opacity: 0;
    animation: ak-drop .7s cubic-bezier(.2,.8,.2,1) forwards;
  }
  .ak-p1 { animation-delay: .15s; }
  .ak-p2 { animation-delay: .35s; }
  .ak-p3 { animation-delay: .35s; }
  @keyframes ak-drop {
    0%   { opacity: 0; transform: translateY(-22px) scale(.96); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }
  .ak-title {
    font-family: "Plus Jakarta Sans", system-ui, sans-serif;
    font-weight: 800; font-size: 30px; letter-spacing: .5px;
    background: linear-gradient(90deg, #19FDD7, #1A81FA);
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
    opacity: 0;
    animation: ak-title-in .8s ease .9s forwards;
  }
  @keyframes ak-title-in {
    0%   { opacity: 0; transform: translateY(10px); letter-spacing: 8px; }
    100% { opacity: 1; transform: translateY(0); letter-spacing: .5px; }
  }
</style>

<script>
  // Splash AnimeKuu: tampil minimal 2.6 detik, lalu hilang setelah halaman siap.
  (function () {
    var splash = document.getElementById("animekuu-splash");
    if (!splash) return;
    var startedAt = Date.now();
    var done = false;
    function hideSplash() {
      if (done) return;
      done = true;
      var wait = Math.max(0, 2600 - (Date.now() - startedAt));
      setTimeout(function () {
        splash.classList.add("ak-out");
        setTimeout(function () { splash.remove(); }, 600);
      }, wait);
    }
    if (document.readyState === "complete") hideSplash();
    else window.addEventListener("load", hideSplash);
    setTimeout(hideSplash, 6000); // jaga-jaga kalau load tertahan
  })();
</script>
<script>

  });
  window.addEventListener('unhandledrejection', (e) => {
